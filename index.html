<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#16233d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Roavely" />
  <title>Roavely</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/favicon.png" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./phase3.css" />
  <link rel="stylesheet" href="./phase4.css" />
  <link rel="stylesheet" href="./cloud.css?v=3" />
  <style>
    .roavely-boot{min-height:92vh;display:flex;align-items:center;justify-content:center;padding:28px;background:#f4f6fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17263e;text-align:center}
    .roavely-boot-inner{max-width:390px;width:100%;border:1px solid #e1e7f1;background:white;box-shadow:0 18px 50px rgba(22,42,72,.08);padding:36px 25px;border-radius:24px}
    .roavely-boot-icon{width:68px;height:68px;border-radius:21px;margin:0 auto 18px;background:linear-gradient(145deg,#315bff,#16233d);display:flex;align-items:center;justify-content:center;font-size:36px;color:white;font-weight:900}
    .roavely-boot h1{font-size:30px;margin:8px 0}.roavely-boot p{color:#66778c;font-size:14px;line-height:1.6}
    .roavely-boot button{display:none;background:#315bff;color:white;font-size:15px;font-weight:700;border:0;border-radius:12px;padding:14px 22px;width:100%;margin:20px 0 5px;cursor:pointer}
    .roavely-boot-status{font-size:12px;color:#91a0b4;margin-top:14px;overflow-wrap:anywhere}
  </style>
  <script>
    window.__roavelyBootErrors=[];
    function roavelyStartupError(message){
      window.__roavelyBootErrors.push(String(message).slice(0,400));
      var note=document.getElementById('roavely-boot-note');
      if(note)note.textContent='Startup error: '+String(message).slice(0,280);
      var retry=document.getElementById('roavely-boot-retry');if(retry)retry.style.display='block';
    }
    window.addEventListener('error',function(e){
      if(e.target&&e.target!==window&&e.target.tagName==='SCRIPT')roavelyStartupError('Could not load '+(e.target.getAttribute('src')||'JavaScript'));
      else if(e.message)roavelyStartupError(e.message);
    },true);
    window.addEventListener('unhandledrejection',function(e){
      var v=e.reason&&e.reason.message?e.reason.message:String(e.reason||'Unexpected promise rejection');
      roavelyStartupError(v);
    });
    window.roavelyRepair=async function(){
      var button=document.getElementById('roavely-boot-retry');
      if(button){button.disabled=true;button.textContent='Refreshing application…';}
      try{
        if('serviceWorker' in navigator){
          var registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.filter(function(r){return r.scope.indexOf('/Roavely/')!==-1;}).map(function(r){return r.unregister()}));
        }
        if('caches' in window){
          var keys=await caches.keys();
          await Promise.all(keys.filter(function(k){return k.indexOf('roavely-')===0;}).map(function(k){return caches.delete(k)}));
        }
      }catch(e){}
      var url=new URL(location.href);url.searchParams.set('fresh',String(Date.now()));location.replace(url.toString());
    };
    window.setTimeout(function(){
      var shell=document.querySelector('#app .shell');
      if(!shell){
        var note=document.getElementById('roavely-boot-note');
        if(note&&!window.__roavelyBootErrors.length)note.textContent='The app did not finish loading. Please retry.';
        var retry=document.getElementById('roavely-boot-retry');if(retry)retry.style.display='block';
      }
    },8000);
  </script>
</head>
<body>
  <div id="app"><div class="roavely-boot"><div class="roavely-boot-inner"><div class="roavely-boot-icon">R</div><h1>Roavely</h1><p>Connecting your adventures…</p><div class="roavely-boot-status" id="roavely-boot-note">Loading your travel planner</div><button id="roavely-boot-retry" onclick="roavelyRepair()">Retry / Refresh App</button></div></div></div>
  <script src="./app.js?v=3"></script>
  <script src="./phase3-discover.js?v=3"></script>
  <script src="./phase3-crew.js?v=3"></script>
  <script src="./phase3-planner.js?v=3"></script>
  <script src="./phase4-board.js?v=3"></script>
  <script src="./phase4-finance.js?v=3"></script>
  <script src="./phase4-personal.js?v=3"></script>
  <script src="./phase4-packing.js?v=3"></script>
  <script src="./phase4-location.js?v=3"></script>
  <script src="./phase4-memories.js?v=3"></script>
  <script src="./cloud-core.js?v=3"></script>
  <script src="./cloud-actions.js?v=3"></script>
  <script>if ('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script>
</body>
</html>
